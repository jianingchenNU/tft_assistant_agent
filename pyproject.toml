[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tft-assistant-agent"
version = "0.1.0"
description = "A small, provider-agnostic foundation for a TFT assistant agent."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
tft-agent = "tft_assistant_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
